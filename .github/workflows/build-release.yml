name: Build Windows Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photocurator-windows-release
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
          pip install pyinstaller

      - name: Build approved app icon
        shell: powershell
        run: |
          python packaging\build_icon.py
          if (!(Test-Path "packaging\PhotoCurator.ico")) { throw "App icon not built" }

      - name: Build PhotoCurator EXE
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name PhotoCurator
          --icon packaging\PhotoCurator.ico
          --version-file packaging\version_info.txt
          --add-data "vendor;vendor"
          --collect-all webview
          --collect-all rawpy
          --collect-all pillow_heif
          desktop_app.py

      - name: Verify packaged executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\PhotoCurator\PhotoCurator.exe")) { throw "PhotoCurator.exe not built" }
          $v=(Get-Item "dist\PhotoCurator\PhotoCurator.exe").VersionInfo.ProductVersion
          Write-Host "Packaged EXE version: $v"
          if ($v -notlike "1.4.2*") { throw "Wrong EXE version: $v" }

      - name: Smoke test packaged executable
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\PhotoCurator\PhotoCurator.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged PhotoCurator self-test failed with exit code $($p.ExitCode)" }

      - name: Download WebView2 bootstrapper
        shell: powershell
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "packaging\MicrosoftEdgeWebview2Setup.exe"
          if (!(Test-Path "packaging\MicrosoftEdgeWebview2Setup.exe")) { throw "WebView2 bootstrapper missing" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $pf86 "Inno Setup 6\ISCC.exe"
          & $iscc "packaging\PhotoCurator.iss"
          if (!(Test-Path "release\PhotoCurator-Setup-v1.4.2.exe")) { throw "Installer not built" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCurator-Setup-v1.4.2
          path: release/PhotoCurator-Setup-v1.4.2.exe
          if-no-files-found: error

      - name: Publish GitHub Release v1.4.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.2
          name: PhotoCurator 中文桌面版 v1.4.2
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          draft: false
          files: release/PhotoCurator-Setup-v1.4.2.exe
          body: |
            ## PhotoCurator 中文桌面版 v1.4.2

            正式封装发布版本。推荐普通 Windows 用户直接下载安装包：
            **PhotoCurator-Setup-v1.4.2.exe**

            ### 本版重点
            - 统一照片整理工作区：清晰度分析、相似组选优、精选推荐、回收站复核
            - PhotoCurator 自有软件回收站，删除后可进行最后一轮复核、恢复或永久删除
            - 大图库增量缓存与长期索引，减少未变化照片重复分析
            - 主图库 Ctrl + 鼠标滚轮调整缩略图尺寸，不缩放整个界面
            - 浅色极光 + iOS 毛玻璃界面与正式 C 图标
            - 支持覆盖升级，保留配置、索引、日志、缓存、照片及软件回收站
            - Windows 安装版无需用户自行安装 Python

            ### 安全说明
            普通“删除”不会直接永久删除照片，而是先进入
            `PhotoCurator_RecycleBin（软件回收站）`。
            只有在“回收站复核”中再次确认永久删除后，文件才会真正从磁盘移除。

            ### 安装
            下载并运行 `PhotoCurator-Setup-v1.4.2.exe` 即可。
            已安装旧版可直接覆盖安装。
