name: Build Windows Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photocurator-windows-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve release metadata
        id: release_meta
        shell: powershell
        run: |
          $manifest = Get-Content "packaging\release_manifest.json" -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Release manifest version is empty" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=PhotoCurator-Setup-v$version.exe" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved PhotoCurator version: $version"

      - name: Verify release tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $expected = "v${{ steps.release_meta.outputs.version }}"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match source version $expected"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
          pip install pyinstaller

      - name: Build approved app icon
        shell: powershell
        run: |
          python packaging\build_icon.py
          if (!(Test-Path "packaging\PhotoCurator.ico")) { throw "App icon not built" }

      - name: Build PhotoCurator EXE
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name PhotoCurator
          --icon packaging\PhotoCurator.ico
          --version-file packaging\version_info.txt
          --add-data "vendor;vendor"
          --add-data "packaging\PhotoCurator.ico;packaging"
          --collect-all webview
          --collect-all rawpy
          --collect-all pillow_heif
          desktop_app.py

      - name: Verify packaged executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\PhotoCurator\PhotoCurator.exe")) { throw "PhotoCurator.exe not built" }
          $v=(Get-Item "dist\PhotoCurator\PhotoCurator.exe").VersionInfo.ProductVersion
          Write-Host "Packaged EXE version: $v"
          $expected = "${{ steps.release_meta.outputs.version }}"
          if ($v -notlike "$expected*") { throw "Wrong EXE version: $v (expected $expected)" }

      - name: Smoke test packaged executable
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\PhotoCurator\PhotoCurator.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged PhotoCurator self-test failed with exit code $($p.ExitCode)" }

      - name: Download WebView2 bootstrapper
        shell: powershell
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "packaging\MicrosoftEdgeWebview2Setup.exe"
          if (!(Test-Path "packaging\MicrosoftEdgeWebview2Setup.exe")) { throw "WebView2 bootstrapper missing" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $pf86 "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.release_meta.outputs.version }}" "packaging\PhotoCurator.iss"
          $installer = "release\${{ steps.release_meta.outputs.installer }}"
          if (!(Test-Path $installer)) { throw "Installer not built: $installer" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCurator-Setup-v${{ steps.release_meta.outputs.version }}
          path: release/${{ steps.release_meta.outputs.installer }}
          if-no-files-found: error

      - name: Verify explicit main release request
        if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v') }}"
        shell: powershell
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $expected = "release: publish v${{ steps.release_meta.outputs.version }}"
          $firstLine = (($env:RELEASE_COMMIT_MESSAGE -split "\r?\n")[0]).Trim()
          if ($firstLine -ne $expected) {
            throw "Release request '$firstLine' does not match source version '$expected'"
          }

      - name: Create release tag after successful installer build
        if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v') }}"
        shell: powershell
        run: |
          $tag = "v${{ steps.release_meta.outputs.version }}"
          $sha = "${{ github.sha }}"
          $remote = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Unable to query remote release tags" }
          if ($remote) {
            $existing = ($remote -split "\s+")[0].Trim()
            if ($existing -ne $sha) {
              throw "Release tag $tag already exists at $existing instead of $sha"
            }
            Write-Host "Release tag $tag already points to this commit."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag $sha
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag $tag" }
          }

      - name: Publish GitHub Release
        if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v')) }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.release_meta.outputs.version) }}
          name: PhotoCurator 中文桌面版 v${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          draft: false
          generate_release_notes: true
          files: release/${{ steps.release_meta.outputs.installer }}
          body: |
            ## PhotoCurator 中文桌面版 v${{ steps.release_meta.outputs.version }}

            推荐普通 Windows 用户直接下载：
            **${{ steps.release_meta.outputs.installer }}**

            普通“删除”默认先进入 PhotoCurator 软件回收站；覆盖安装只替换程序目录，
            保留配置、索引、缓存、任务状态和用户照片。下方变更列表由 GitHub
            根据本次标签与上一正式版本之间的提交自动生成。
