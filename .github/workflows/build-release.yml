# Signed Stable gate: repo variable PHOTOCURATOR_RELEASE_APPROVED_VERSION
# is set only after physical Windows/USB and in-place-upgrade validation.
# GitHub Secrets PHOTOCURATOR_SIGNING_PFX_BASE64 and
# PHOTOCURATOR_SIGNING_PFX_PASSWORD are mandatory. Never commit the PFX.
name: Build Windows Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photocurator-windows-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows-installer:
    # Only consume a Windows runner for an explicit release, a tag build, or a manual run.
    # Ordinary pushes to main no longer rebuild the installer.
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v')) }}"
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve release metadata
        id: release_meta
        shell: powershell
        run: |
          $manifest = Get-Content "packaging\release_manifest.json" -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $published = [string]$manifest.published_version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Release manifest version is empty" }
          if ([string]::IsNullOrWhiteSpace($published)) { throw "Published version metadata is empty" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=PhotoCurator-Setup-v$version.exe" >> $env:GITHUB_OUTPUT
          "published_version=$published" >> $env:GITHUB_OUTPUT
          "published_installer=PhotoCurator-Setup-v$published.exe" >> $env:GITHUB_OUTPUT
          Write-Host "Target PhotoCurator version: $version"
          Write-Host "Currently published version: $published"

      - name: Reject release without real-device QA approval
        shell: powershell
        env:
          APPROVED_VERSION: ${{ vars.PHOTOCURATOR_RELEASE_APPROVED_VERSION }}
          SIGN_PFX: ${{ secrets.PHOTOCURATOR_SIGNING_PFX_BASE64 }}
          SIGN_PASS: ${{ secrets.PHOTOCURATOR_SIGNING_PFX_PASSWORD }}
        run: |
          $expected = "${{ steps.release_meta.outputs.version }}"
          if ($env:APPROVED_VERSION -ne $expected) {
            throw "No explicit QA approval for version $expected (Windows device, USB, upgrade)."
          }
          if (!$env:SIGN_PFX -or !$env:SIGN_PASS) {
            throw "Stable releases require configured Authenticode signing secrets."
          }

      - name: Verify README still points to the last actually published installer
        shell: powershell
        run: |
          $published = "${{ steps.release_meta.outputs.published_version }}"
          $installer = "${{ steps.release_meta.outputs.published_installer }}"
          $readme = Get-Content "README.md" -Raw
          $expected = "https://github.com/${{ github.repository }}/releases/download/v$published/$installer"
          if (-not $readme.Contains($expected)) {
            throw "README published installer link is dishonest or stale. Expected: $expected"
          }
          Write-Host "README correctly keeps the last real release until the new asset exists."
      - name: Verify release tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $expected = "v${{ steps.release_meta.outputs.version }}"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match source version $expected"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
          pip install pyinstaller "selenium>=4.25,<5" "pip-audit>=2.7,<3"

      - name: Release-gate source tests
        shell: powershell
        run: |
          python -m py_compile db_runtime.py desktop_app.py runtime_paths.py catalog.py photo_curator.py background_tasks.py raw_loader.py exact_duplicates.py tests/test_exact_duplicates.py ui_smoke_test.py windows_smoke_test.py performance_gate_test.py
          if ($LASTEXITCODE -ne 0) { throw "py_compile failed" }
          python -c "import runpy; runpy.run_path('\u57fa\u7840\u5192\u70df\u6d4b\u8bd5.py', run_name='__main__')"
          if ($LASTEXITCODE -ne 0) { throw "base smoke test failed" }
          python -m unittest -v tests.test_exact_duplicates
          if ($LASTEXITCODE -ne 0) { throw "exact duplicate regression failed" }
          python release_gate_test.py
          if ($LASTEXITCODE -ne 0) { throw "release_gate_test failed" }
          python performance_gate_test.py
          if ($LASTEXITCODE -ne 0) { throw "performance_gate_test failed" }
          python ui_smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw "ui_smoke_test failed" }
          pip-audit -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip-audit failed" }

      - name: Build approved app icon
        shell: powershell
        run: |
          python packaging\build_icon.py
          if (!(Test-Path "packaging\PhotoCurator.ico")) { throw "App icon not built" }

      - name: Build PhotoCurator EXE
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name PhotoCurator
          --icon packaging\PhotoCurator.ico
          --version-file packaging\version_info.txt
          --add-data "vendor;vendor"
          --add-data "packaging\PhotoCurator.ico;packaging"
          --collect-all webview
          --collect-all rawpy
          --collect-all pillow_heif
          --collect-data cv2
          desktop_app.py

      - name: Verify packaged executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\PhotoCurator\PhotoCurator.exe")) { throw "PhotoCurator.exe not built" }
          $v=(Get-Item "dist\PhotoCurator\PhotoCurator.exe").VersionInfo.ProductVersion
          Write-Host "Packaged EXE version: $v"
          $expected = "${{ steps.release_meta.outputs.version }}"
          if ($v -notlike "$expected*") { throw "Wrong EXE version: $v (expected $expected)" }

      - name: Sign and verify packaged EXE
        shell: powershell
        env:
          PHOTOCURATOR_SIGNING_PFX_BASE64: ${{ secrets.PHOTOCURATOR_SIGNING_PFX_BASE64 }}
          PHOTOCURATOR_SIGNING_PFX_PASSWORD: ${{ secrets.PHOTOCURATOR_SIGNING_PFX_PASSWORD }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "packaging\\sign_release.ps1" -Target "dist\\PhotoCurator\\PhotoCurator.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing or verification failed" }

      - name: Smoke test packaged executable
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\PhotoCurator\PhotoCurator.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged PhotoCurator self-test failed with exit code $($p.ExitCode)" }

      - name: Download WebView2 bootstrapper
        shell: powershell
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "packaging\MicrosoftEdgeWebview2Setup.exe"
          if (!(Test-Path "packaging\MicrosoftEdgeWebview2Setup.exe")) { throw "WebView2 bootstrapper missing" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $pf86 "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.release_meta.outputs.version }}" "packaging\PhotoCurator.iss"
          $installer = "release\${{ steps.release_meta.outputs.installer }}"
          if (!(Test-Path $installer)) { throw "Installer not built: $installer" }

      - name: Sign and verify Windows installer
        shell: powershell
        env:
          PHOTOCURATOR_SIGNING_PFX_BASE64: ${{ secrets.PHOTOCURATOR_SIGNING_PFX_BASE64 }}
          PHOTOCURATOR_SIGNING_PFX_PASSWORD: ${{ secrets.PHOTOCURATOR_SIGNING_PFX_PASSWORD }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "packaging\\sign_release.ps1" -Target "release\\${{ steps.release_meta.outputs.installer }}"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing or verification failed" }

      - name: Generate installer SHA256
        id: checksum
        shell: powershell
        run: |
          $installer = "release\${{ steps.release_meta.outputs.installer }}"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash *${{ steps.release_meta.outputs.installer }}"
          $shaFile = "$installer.sha256"
          Set-Content -Path $shaFile -Value $line -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Installer SHA256: $hash"
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: PhotoCurator-Setup-v${{ steps.release_meta.outputs.version }}
          path: |
            release/${{ steps.release_meta.outputs.installer }}
            release/${{ steps.release_meta.outputs.installer }}.sha256
          if-no-files-found: error

      - name: Verify explicit main release request
        if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v') }}"
        shell: powershell
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $expected = "release: publish v${{ steps.release_meta.outputs.version }}"
          $firstLine = (($env:RELEASE_COMMIT_MESSAGE -split "\r?\n")[0]).Trim()
          if ($firstLine -ne $expected) {
            throw "Release request '$firstLine' does not match source version '$expected'"
          }

      - name: Create release tag after successful installer build
        if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v') }}"
        shell: powershell
        run: |
          $tag = "v${{ steps.release_meta.outputs.version }}"
          $sha = "${{ github.sha }}"
          $remote = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Unable to query remote release tags" }
          if ($remote) {
            $existing = ($remote -split "\s+")[0].Trim()
            if ($existing -ne $sha) {
              throw "Release tag $tag already exists at $existing instead of $sha"
            }
            Write-Host "Release tag $tag already points to this commit."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag $sha
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag $tag" }
          }

      - name: Publish GitHub Release
        if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v')) }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.release_meta.outputs.version) }}
          name: PhotoCurator 中文桌面版 v${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          draft: false
          generate_release_notes: true
          files: |
            release/${{ steps.release_meta.outputs.installer }}
            release/${{ steps.release_meta.outputs.installer }}.sha256
          body: |
            ## PhotoCurator 中文桌面版 v${{ steps.release_meta.outputs.version }}

            推荐普通 Windows 用户直接下载：
            **${{ steps.release_meta.outputs.installer }}**

            SHA256：`${{ steps.checksum.outputs.sha256 }}`

            普通“删除”默认先进入 PhotoCurator 软件回收站；覆盖安装只替换程序目录，
            保留配置、索引、缓存、任务状态和用户照片。下方变更列表由 GitHub
            根据本次标签与上一正式版本之间的提交自动生成。
      - name: Verify published release asset
        if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v')) }}"
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.release_meta.outputs.version }}"
          $asset = "${{ steps.release_meta.outputs.installer }}"
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          $match = $release.assets | Where-Object { $_.name -eq $asset }
          if (-not $match) { throw "Published release is missing installer asset: $asset" }
          if ([int64]$match.size -le 0) { throw "Published installer asset is empty" }
          Write-Host "Verified release asset: $asset ($($match.size) bytes)"

      - name: Mark release metadata as published
        if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v') }}"
        shell: powershell
        run: |
          @'
          import json
          import re
          from pathlib import Path

          manifest_path = Path("packaging/release_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          version = str(manifest["version"])
          installer = f"PhotoCurator-Setup-v{version}.exe"
          manifest["published_version"] = version
          manifest["published_installer"] = installer
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          repo = "${{ github.repository }}"
          block = f"""<!-- LATEST_RELEASE_START -->
          ## ⬇️ 当前可下载 Windows 安装包

          **当前已发布版：v{version}**

          [**点击下载 {installer}**](https://github.com/{repo}/releases/download/v{version}/{installer})

          > Windows 10 / 11 x64 · 正式安装版 EXE  
          > 当前源码与正式发布版本均为 **v{version}**。
          <!-- LATEST_RELEASE_END -->"""
          readme = re.sub(
              r"<!-- LATEST_RELEASE_START -->.*?<!-- LATEST_RELEASE_END -->",
              block, readme, count=1, flags=re.S,
          )
          readme_path.write_text(readme, encoding="utf-8")
          '@ | python -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/release_manifest.json README.md
          git commit -m "chore: mark v${{ steps.release_meta.outputs.version }} published"
          git push origin HEAD:main
