name: Build Windows Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
          pip install pyinstaller

      - name: Build PhotoCurator EXE
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name PhotoCurator
          --version-file packaging\version_info.txt
          --add-data "vendor;vendor"
          --collect-all webview
          desktop_app.py

      - name: Verify packaged executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\PhotoCurator\PhotoCurator.exe")) { throw "PhotoCurator.exe not built" }
          $v=(Get-Item "dist\PhotoCurator\PhotoCurator.exe").VersionInfo.ProductVersion
          Write-Host "Packaged EXE version: $v"
          if ($v -notlike "1.3.0*") { throw "Wrong EXE version: $v" }

      - name: Download WebView2 bootstrapper
        shell: powershell
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "packaging\MicrosoftEdgeWebview2Setup.exe"
          if (!(Test-Path "packaging\MicrosoftEdgeWebview2Setup.exe")) { throw "WebView2 bootstrapper missing" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $pf86 "Inno Setup 6\ISCC.exe"
          & $iscc "packaging\PhotoCurator.iss"
          if (!(Test-Path "release\PhotoCurator-Setup-v1.3.0.exe")) { throw "Installer not built" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCurator-Setup-v1.3.0
          path: release/PhotoCurator-Setup-v1.3.0.exe
          if-no-files-found: error
