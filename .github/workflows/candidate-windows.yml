name: Build Windows Candidate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photocurator-windows-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: windows-latest
    env:
      CANDIDATE_VERSION: "1.7.9"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Stamp candidate version safely
        shell: powershell
        run: |
          @'
          import os
          import re
          from pathlib import Path

          version = os.environ["CANDIDATE_VERSION"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"invalid candidate version: {version!r}")

          for name in ("desktop_app.py", "photo_curator.py"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text, count = re.subn(
                  r'^APP_VERSION\s*=\s*"[^"]+"',
                  f'APP_VERSION = "{version}"',
                  text,
                  count=1,
                  flags=re.M,
              )
              if count != 1:
                  raise SystemExit(f"APP_VERSION replacement failed: {name}")
              path.write_text(text, encoding="utf-8", newline="\n")

          path = Path("packaging/version_info.txt")
          text = path.read_text(encoding="utf-8")
          major, minor, patch = map(int, version.split("."))
          version_tuple = f"({major}, {minor}, {patch}, 0)"
          text = re.sub(r'filevers=\(\d+,\s*\d+,\s*\d+,\s*\d+\)',
                        "filevers=" + version_tuple, text, count=1)
          text = re.sub(r'prodvers=\(\d+,\s*\d+,\s*\d+,\s*\d+\)',
                        "prodvers=" + version_tuple, text, count=1)
          text = re.sub(r"StringStruct\('FileVersion', '[^']+'\)",
                        f"StringStruct('FileVersion', '{version}')", text, count=1)
          text = re.sub(r"StringStruct\('ProductVersion', '[^']+'\)",
                        f"StringStruct('ProductVersion', '{version}')", text, count=1)
          path.write_text(text, encoding="utf-8", newline="\n")

          # Candidate builds must never corrupt the Chinese UI while stamping.
          for name in ("desktop_app.py", "photo_curator.py"):
              text = Path(name).read_text(encoding="utf-8")
              required = (
                  ("\u7167\u7247\u7b5b\u9009",) if name == "desktop_app.py"
                  else (
                      "\u6a21\u7cca\u5e9f\u7247",
                      "\u76f8\u4f3c\u7167\u7247",
                      "\u56de\u6536\u7ad9",
                      "\u5f00\u59cb\u5206\u6790",
                  )
              )
              missing = [item for item in required if item not in text]
              if missing:
                  raise SystemExit(f"UTF-8/UI text corrupted in {name}: {missing}")
              mojibake = (
                  "\u00c3", "\u00c2", "\u00e4\u00b8",
                  "\u00e6\u00a8", "\u00e7\u2030", "\u00e5\u203a",
              )
              bad = [token for token in mojibake if token in text]
              if bad:
                  raise SystemExit(f"mojibake detected in {name}: {bad}")

          print("Candidate version stamped with explicit UTF-8:", version)
          '@ | python -

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
          pip install pyinstaller "selenium>=4.25,<5" "pip-audit>=2.7,<3"

      - name: Release-gate source tests
        shell: powershell
        run: |
          python -m py_compile db_runtime.py desktop_app.py runtime_paths.py catalog.py photo_curator.py background_tasks.py raw_loader.py exact_duplicates.py test_exact_duplicates.py ui_smoke_test.py windows_smoke_test.py performance_gate_test.py
          if ($LASTEXITCODE -ne 0) { throw "py_compile failed" }
          python -c "import runpy; runpy.run_path('\u57fa\u7840\u5192\u70df\u6d4b\u8bd5.py', run_name='__main__')"
          if ($LASTEXITCODE -ne 0) { throw "base smoke test failed" }
          python -m unittest -v test_exact_duplicates
          if ($LASTEXITCODE -ne 0) { throw "exact duplicate regression failed" }
          python release_gate_test.py
          if ($LASTEXITCODE -ne 0) { throw "release_gate_test failed" }
          python performance_gate_test.py
          if ($LASTEXITCODE -ne 0) { throw "performance_gate_test failed" }
          python ui_smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw "ui_smoke_test failed" }
          pip-audit -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip-audit failed" }

      - name: Build approved app icon
        shell: powershell
        run: |
          python packaging\build_icon.py
          if (!(Test-Path "packaging\PhotoCurator.ico")) { throw "App icon not built" }

      - name: Build candidate EXE
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name PhotoCurator
          --icon packaging\PhotoCurator.ico
          --version-file packaging\version_info.txt
          --add-data "vendor;vendor"
          --add-data "packaging\PhotoCurator.ico;packaging"
          --collect-all webview
          --collect-all rawpy
          --collect-all pillow_heif
          desktop_app.py

      - name: Verify packaged candidate
        shell: powershell
        run: |
          $exe = "dist\PhotoCurator\PhotoCurator.exe"
          if (!(Test-Path $exe)) { throw "Candidate EXE not built" }
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          if ($v -notlike "$env:CANDIDATE_VERSION*") {
            throw "Wrong candidate EXE version: $v"
          }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Candidate packaged self-test failed: $($p.ExitCode)"
          }

      - name: Verify packaged desktop window remains responsive
        shell: powershell
        run: |
          $exe = Resolve-Path "dist\PhotoCurator\PhotoCurator.exe"
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 400
              $p.Refresh()
              if ($p.HasExited) {
                throw "Candidate desktop exited before opening a usable window. ExitCode=$($p.ExitCode)"
              }
            } while ($p.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)

            if ($p.MainWindowHandle -eq 0) {
              throw "Candidate desktop did not create a native Windows window within 20 seconds"
            }

            Add-Type -Namespace PhotoCurator -Name WindowProbe -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll", SetLastError=true)] public static extern System.IntPtr SendMessageTimeout(System.IntPtr hWnd, uint Msg, System.IntPtr wParam, System.IntPtr lParam, uint fuFlags, uint uTimeout, out System.IntPtr lpdwResult);'
            $SMTO_ABORTIFHUNG = 0x0002
            $lastCheckpoint = 0
            foreach ($checkpoint in @(1, 3, 5, 10, 20)) {
              $sleepFor = $checkpoint - $lastCheckpoint
              if ($sleepFor -gt 0) { Start-Sleep -Seconds $sleepFor }
              $lastCheckpoint = $checkpoint

              $p.Refresh()
              if ($p.HasExited) {
                throw ("Candidate desktop exited during liveness window at " + $checkpoint + "s")
              }
              $hwnd = $p.MainWindowHandle
              if ($hwnd -eq 0) {
                throw ("Candidate lost its native window at " + $checkpoint + "s")
              }

              $result = [IntPtr]::Zero
              $ok = [PhotoCurator.WindowProbe]::SendMessageTimeout(
                $hwnd, 0x0000, [IntPtr]::Zero, [IntPtr]::Zero,
                $SMTO_ABORTIFHUNG, 3000, [ref]$result
              )
              $p.Refresh()
              if ($ok -eq [IntPtr]::Zero -or -not $p.Responding) {
                throw ("Candidate native window became unresponsive at " + $checkpoint + "s")
              }
              Write-Host ("Native window responsive at " + $checkpoint + "s.")
            }
            if ($p.MainWindowTitle -notlike "PhotoCurator*") {
              throw "Unexpected native window title: $($p.MainWindowTitle)"
            }

            Add-Type -TypeDefinition @'
            using System;
            using System.Runtime.InteropServices;
            public static class PhotoCuratorGeometry {
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
              [StructLayout(LayoutKind.Sequential)] public struct MONITORINFO {
                public int cbSize; public RECT rcMonitor; public RECT rcWork; public uint dwFlags;
              }
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
              [DllImport("user32.dll")] public static extern IntPtr MonitorFromWindow(IntPtr hwnd, uint flags);
              [DllImport("user32.dll")] public static extern bool GetMonitorInfo(IntPtr hMonitor, ref MONITORINFO info);
            }
          '@
            $wr = New-Object PhotoCuratorGeometry+RECT
            if (-not [PhotoCuratorGeometry]::GetWindowRect($p.MainWindowHandle, [ref]$wr)) {
              throw "Unable to read candidate window geometry"
            }
            $mon = [PhotoCuratorGeometry]::MonitorFromWindow($p.MainWindowHandle, 2)
            $mi = New-Object PhotoCuratorGeometry+MONITORINFO
            $mi.cbSize = [Runtime.InteropServices.Marshal]::SizeOf($mi)
            if (-not [PhotoCuratorGeometry]::GetMonitorInfo($mon, [ref]$mi)) {
              throw "Unable to read monitor work area"
            }
            if ($wr.Left -lt $mi.rcWork.Left -or $wr.Top -lt $mi.rcWork.Top -or
                $wr.Right -gt $mi.rcWork.Right -or $wr.Bottom -gt $mi.rcWork.Bottom) {
              throw ("Candidate window overlaps reserved desktop/taskbar area. Window=" +
                     "$($wr.Left),$($wr.Top),$($wr.Right),$($wr.Bottom) Work=" +
                     "$($mi.rcWork.Left),$($mi.rcWork.Top),$($mi.rcWork.Right),$($mi.rcWork.Bottom)")
            }
            Write-Host "Window stays within Windows work area."
          }
          finally {
            if (!$p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $p.WaitForExit(5000) | Out-Null
            }
          }

      - name: Download WebView2 bootstrapper
        shell: powershell
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "packaging\MicrosoftEdgeWebview2Setup.exe"
          if (!(Test-Path "packaging\MicrosoftEdgeWebview2Setup.exe")) {
            throw "WebView2 bootstrapper missing"
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build test installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $pf86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $iscc = Join-Path $pf86 "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:CANDIDATE_VERSION" "packaging\PhotoCurator.iss"
          $installer = "release\PhotoCurator-Setup-v$env:CANDIDATE_VERSION.exe"
          if (!(Test-Path $installer)) { throw "Candidate installer not built: $installer" }

      - name: Upload v1.7.9 test installer
        uses: actions/upload-artifact@v7
        with:
          name: PhotoCurator-v1.7.9-test-installer
          path: release/PhotoCurator-Setup-v1.7.9.exe
          if-no-files-found: error
          retention-days: 14
