name: Build Windows Candidate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photocurator-windows-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix-v1.5.1'
    runs-on: windows-latest
    env:
      CANDIDATE_VERSION: "1.5.3"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Stamp candidate version safely
        shell: powershell
        run: |
          @'
          import os
          import re
          from pathlib import Path

          version = os.environ["CANDIDATE_VERSION"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"invalid candidate version: {version!r}")

          for name in ("desktop_app.py", "photo_curator.py"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text, count = re.subn(
                  r'^APP_VERSION\s*=\s*"[^"]+"',
                  f'APP_VERSION = "{version}"',
                  text,
                  count=1,
                  flags=re.M,
              )
              if count != 1:
                  raise SystemExit(f"APP_VERSION replacement failed: {name}")
              path.write_text(text, encoding="utf-8", newline="\n")

          path = Path("packaging/version_info.txt")
          text = path.read_text(encoding="utf-8")
          major, minor, patch = map(int, version.split("."))
          version_tuple = f"({major}, {minor}, {patch}, 0)"
          text = re.sub(r'filevers=\(\d+,\s*\d+,\s*\d+,\s*\d+\)',
                        "filevers=" + version_tuple, text, count=1)
          text = re.sub(r'prodvers=\(\d+,\s*\d+,\s*\d+,\s*\d+\)',
                        "prodvers=" + version_tuple, text, count=1)
          text = re.sub(r"StringStruct\('FileVersion', '[^']+'\)",
                        f"StringStruct('FileVersion', '{version}')", text, count=1)
          text = re.sub(r"StringStruct\('ProductVersion', '[^']+'\)",
                        f"StringStruct('ProductVersion', '{version}')", text, count=1)
          path.write_text(text, encoding="utf-8", newline="\n")

          # Candidate builds must never corrupt the Chinese UI while stamping.
          for name in ("desktop_app.py", "photo_curator.py"):
              text = Path(name).read_text(encoding="utf-8")
              required = (
                  ("\u7167\u7247\u7b5b\u9009",) if name == "desktop_app.py"
                  else (
                      "\u6a21\u7cca\u5e9f\u7247",
                      "\u76f8\u4f3c\u7167\u7247",
                      "\u56de\u6536\u7ad9",
                      "\u5f00\u59cb\u5206\u6790",
                  )
              )
              missing = [item for item in required if item not in text]
              if missing:
                  raise SystemExit(f"UTF-8/UI text corrupted in {name}: {missing}")
              mojibake = (
                  "\u00c3", "\u00c2", "\u00e4\u00b8",
                  "\u00e6\u00a8", "\u00e7\u2030", "\u00e5\u203a",
              )
              bad = [token for token in mojibake if token in text]
              if bad:
                  raise SystemExit(f"mojibake detected in {name}: {bad}")

          print("Candidate version stamped with explicit UTF-8:", version)
          '@ | python -

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
          pip install pyinstaller

      - name: Build approved app icon
        shell: powershell
        run: |
          python packaging\build_icon.py
          if (!(Test-Path "packaging\PhotoCurator.ico")) { throw "App icon not built" }

      - name: Build candidate EXE
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name PhotoCurator
          --icon packaging\PhotoCurator.ico
          --version-file packaging\version_info.txt
          --add-data "vendor;vendor"
          --add-data "packaging\PhotoCurator.ico;packaging"
          --collect-all webview
          --collect-all rawpy
          --collect-all pillow_heif
          desktop_app.py

      - name: Verify packaged candidate
        shell: powershell
        run: |
          $exe = "dist\PhotoCurator\PhotoCurator.exe"
          if (!(Test-Path $exe)) { throw "Candidate EXE not built" }
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          if ($v -notlike "$env:CANDIDATE_VERSION*") {
            throw "Wrong candidate EXE version: $v"
          }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Candidate packaged self-test failed: $($p.ExitCode)"
          }

      - name: Verify packaged desktop window remains responsive
        shell: powershell
        run: |
          $exe = Resolve-Path "dist\PhotoCurator\PhotoCurator.exe"
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 400
              $p.Refresh()
              if ($p.HasExited) {
                throw "Candidate desktop exited before opening a usable window. ExitCode=$($p.ExitCode)"
              }
            } while ($p.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)

            if ($p.MainWindowHandle -eq 0) {
              throw "Candidate desktop did not create a native Windows window within 20 seconds"
            }

            Add-Type @"
using System;
using System.Runtime.InteropServices;
public static class PhotoCuratorWindowProbe {
    [DllImport("user32.dll", SetLastError=true)]
    public static extern IntPtr SendMessageTimeout(
        IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam,
        uint fuFlags, uint uTimeout, out IntPtr lpdwResult);
}
"@
            $result = [IntPtr]::Zero
            $SMTO_ABORTIFHUNG = 0x0002
            $ok = [PhotoCuratorWindowProbe]::SendMessageTimeout(
              $p.MainWindowHandle, 0x0000, [IntPtr]::Zero, [IntPtr]::Zero,
              $SMTO_ABORTIFHUNG, 3000, [ref]$result
            )
            $p.Refresh()
            if ($ok -eq [IntPtr]::Zero -or -not $p.Responding) {
              throw "Candidate native window message loop is not responding"
            }
            Write-Host "Packaged native Windows window is responsive."
          }
          finally {
            if (!$p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $p.WaitForExit(5000) | Out-Null
            }
          }

      - name: Download WebView2 bootstrapper
        shell: powershell
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "packaging\MicrosoftEdgeWebview2Setup.exe"
          if (!(Test-Path "packaging\MicrosoftEdgeWebview2Setup.exe")) {
            throw "WebView2 bootstrapper missing"
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build test installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $pf86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $iscc = Join-Path $pf86 "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:CANDIDATE_VERSION" "packaging\PhotoCurator.iss"
          $installer = "release\PhotoCurator-Setup-v$env:CANDIDATE_VERSION.exe"
          if (!(Test-Path $installer)) { throw "Candidate installer not built: $installer" }

      - name: Upload v1.5.3 test installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCurator-v1.5.3-test-installer
          path: release/PhotoCurator-Setup-v1.5.3.exe
          if-no-files-found: error
          retention-days: 14
