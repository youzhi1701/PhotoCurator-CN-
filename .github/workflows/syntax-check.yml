name: Source syntax check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: photocurator-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    # Only consume a Linux runner for PRs, explicit releases, or manual checks.
    # Ordinary direct pushes to main are runner-free.
    if: "${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: publish v')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            db_runtime.py \
            desktop_app.py \
            runtime_paths.py \
            catalog.py \
            photo_curator.py \
            background_tasks.py \
            photo_dedup_batch.py \
            exact_duplicates.py \
            test_exact_duplicates.py \
            photo_file_organizer.py \
            photo_ranking_engine.py \
            photo_ranking_v3.py \
            quality_annotations.py \
            test_quality_annotations.py \
            quality_annotations_input_test.py \
            test_runtime_migration_wal.py \
            test_offline_preview_guard.py \
            test_scan_error_fail_closed.py \
            test_device_connection_identity.py \
            test_storage_cleanup_containment.py \
            scene_labels.py \
            test_scene_labels.py \
            test_raw_pair_protection.py \
            test_rank_topn_selection.py \
            raw_loader.py \
            "基础冒烟测试.py" \
            "Codespaces冒烟测试.py" \
            windows_smoke_test.py \
            ui_smoke_test.py \
            release_gate_test.py \
            performance_gate_test.py

      - name: Parse GitHub Actions YAML
        run: |
          python -m pip install "PyYAML>=6,<7"
          python - <<'PY'
          from pathlib import Path
          import yaml

          for workflow in sorted(Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(workflow.read_text(encoding="utf-8"))
              print("YAML OK:", workflow)
          PY

      - name: Validate packaging and version consistency
        run: |
          bash -n "在线预览.sh"
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          json.loads(Path(".devcontainer/devcontainer.json").read_text(encoding="utf-8"))
          desktop = Path("desktop_app.py").read_text(encoding="utf-8")
          runtime_paths = Path("runtime_paths.py").read_text(encoding="utf-8")
          core = Path("photo_curator.py").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          def version(source):
              m = re.search(r'^APP_VERSION\s*=\s*"([^"]+)"', source, re.M)
              if not m:
                  raise SystemExit("APP_VERSION not found")
              return m.group(1)

          dv = version(desktop)
          cv = version(core)
          if dv != cv:
              raise SystemExit(f"Version mismatch: desktop={dv}, core={cv}")
          if f"v{dv}" not in readme:
              raise SystemExit(f"README missing current development build v{dv}")

          installer = Path("packaging/PhotoCurator.iss").read_text(encoding="utf-8")
          version_info = Path("packaging/version_info.txt").read_text(encoding="utf-8")
          build_workflow = Path(".github/workflows/build-release.yml").read_text(encoding="utf-8")
          manifest = json.loads(Path("packaging/release_manifest.json").read_text(encoding="utf-8"))

          if not re.fullmatch(r"\d+\.\d+\.\d+", dv):
              raise SystemExit(f"APP_VERSION must be numeric semver x.y.z: {dv}")

          # Development/candidate version may be ahead of the latest
          # actually published Release. Keep build target and public download
          # metadata separate so README never advertises a nonexistent EXE.
          rv = str(manifest.get("version") or "")
          if not re.fullmatch(r"\d+\.\d+\.\d+", rv):
              raise SystemExit(f"Release manifest version must be semver: {rv!r}")
          expected_installer = f"PhotoCurator-Setup-v{rv}.exe"
          if manifest.get("installer") != expected_installer:
              raise SystemExit("Release manifest installer name does not match target release version")
          pv = str(manifest.get("published_version") or "")
          if not re.fullmatch(r"\d+\.\d+\.\d+", pv):
              raise SystemExit(f"Published release version must be semver: {pv!r}")
          expected_published_installer = f"PhotoCurator-Setup-v{pv}.exe"
          if manifest.get("published_installer") != expected_published_installer:
              raise SystemExit("Published installer metadata is inconsistent")
          latest_marker = "<!-- LATEST_RELEASE_START -->"
          expected_download = (
              f"https://github.com/youzhi1701/PhotoCurator-CN-/releases/download/"
              f"v{pv}/{expected_published_installer}"
          )
          marker_pos = readme.find(latest_marker)
          if marker_pos < 0 or marker_pos > 1200:
              raise SystemExit("README latest-release block must stay near the top")
          if expected_download not in readme:
              raise SystemExit(
                  "README latest EXE download link does not match current release: "
                  + expected_download
              )
          if manifest.get("upgrade_mode") != "in_place" or manifest.get("same_app_id") is not True:
              raise SystemExit("Release manifest must keep in-place upgrade + stable AppId policy")
          if manifest.get("replace") != ["app"]:
              raise SystemExit("Release manifest may replace only the app directory")
          required_preserve = {
              "%LOCALAPPDATA%/PhotoCurator/data/config/library_index.sqlite3",
              "%LOCALAPPDATA%/PhotoCurator/data/cache",
              "%LOCALAPPDATA%/PhotoCurator/data/logs",
              "user_photo_folders",
              "PhotoCurator_RecycleBin（软件回收站）",
          }
          if not required_preserve.issubset(set(manifest.get("preserve") or [])):
              raise SystemExit("Release manifest lost required preserved user/runtime data")

          if f'#define MyAppVersion "{dv}"' not in installer:
              raise SystemExit("Installer fallback version does not match APP_VERSION")
          if "#ifndef MyAppVersion" not in installer:
              raise SystemExit("Installer version must be overridable by release metadata")
          if "VersionInfoVersion={#MyAppVersion}.0" not in installer:
              raise SystemExit("Installer VersionInfoVersion must follow MyAppVersion")
          if f"StringStruct('ProductVersion', '{dv}')" not in version_info:
              raise SystemExit("EXE version info does not match APP_VERSION")

          gh_expr = "$" + "{{"
          release_required = [
              'tags: ["v*"]',
              "id: release_meta",
              'Get-Content "packaging\\release_manifest.json"',
              '"version=$version" >> $env:GITHUB_OUTPUT',
              '"installer=PhotoCurator-Setup-v$version.exe" >> $env:GITHUB_OUTPUT',
              "if: startsWith(github.ref, 'refs/tags/')",
              '"v' + gh_expr + ' steps.release_meta.outputs.version }}"',
              '/DMyAppVersion=' + gh_expr + ' steps.release_meta.outputs.version }}',
              "Verify explicit main release request",
              "Create release tag after successful installer build",
              "release: publish v" + gh_expr + " steps.release_meta.outputs.version }}",
              'git push origin "refs/tags/$tag"',
              "startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main'",
              "format('v{0}', steps.release_meta.outputs.version)",
              'release/' + gh_expr + ' steps.release_meta.outputs.installer }}.sha256',
              'generate_release_notes: true',
              "Generate installer SHA256",
              "Verify published release asset",
              "Mark release metadata as published",
          ]
          missing_release = [x for x in release_required if x not in build_workflow]
          if missing_release:
              raise SystemExit("Manifest-driven release workflow regression: " + repr(missing_release))
          if "refs/tags/v1.5.0" in build_workflow:
              raise SystemExit("Release workflow must not hardcode a single version tag")

          # Frozen layout contract:
          #   {app}/app/PhotoCurator.exe is replaceable program content.
          #   writable state lives under %LOCALAPPDATA%/PhotoCurator/data.
          layout_required = [
              'DestDir: "{app}\\app"',
              'Name: "{localappdata}\\PhotoCurator\\data"',
              'Name: "{localappdata}\\PhotoCurator\\data\\config"',
              'Filename: "{app}\\app\\{#MyAppExeName}"',
              'Type: filesandordirs; Name: "{app}\\app"',
          ]
          missing_layout = [x for x in layout_required if x not in installer]
          if missing_layout:
              raise SystemExit("Installer layout contract regression: " + repr(missing_layout))
          install_delete = installer.split("[InstallDelete]", 1)[1].split("[Files]", 1)[0]
          if 'Type: filesandordirs; Name: "{localappdata}\\PhotoCurator\\data' in install_delete:
              raise SystemExit("Cover upgrade must never delete the per-user runtime data directory")
          # Never forcibly terminate an application that might be moving or
          # deleting photo files during an in-place upgrade.
          safe_close_required = [
              'function PrepareToInstall(var NeedsRestart: Boolean): String;',
              "CheckForMutexes(PhotoCuratorMutex)",
              "CloseApplications=no",
              "PhotoCurator 仍在运行",
          ]
          missing_safe_close = [x for x in safe_close_required if x not in installer]
          if missing_safe_close:
              raise SystemExit("Safe installer upgrade guard missing: " + repr(missing_safe_close))
          if "taskkill.exe" in installer or '/F /T /IM' in installer:
              raise SystemExit("Installer must never force-kill active photo-file operations")
          if 'INSTALL_ROOT = (' not in desktop or 'Path(sys.executable).resolve().parent.parent' not in desktop:
              raise SystemExit("Frozen desktop root no longer matches {app}/app executable layout")
          if 'DATA_ROOT = resolve_data_root(frozen=IS_FROZEN)' not in desktop:
              raise SystemExit("Desktop runtime data must use the shared resolver")
          if 'migrate_legacy_config(legacy_root, DATA_ROOT)' not in desktop:
              raise SystemExit("Installed upgrades must preserve the legacy config migration")
          if 'os.environ["PHOTOCURATOR_DATA_DIR"] = str(DATA_ROOT)' not in desktop:
              raise SystemExit("Desktop must pass the resolved data root into the core")
          if 'DATA_ROOT = resolve_data_root(frozen=IS_FROZEN)' not in core:
              raise SystemExit("Core must honor the shared runtime data resolver")
          runtime_required = [
              'ENV_DATA_DIR = "PHOTOCURATOR_DATA_DIR"',
              'return base / APP_DIR_NAME / "data"',
              'def migrate_legacy_config',
              'copy_function=_link_or_copy',
              'target_config = target_root / "config"',
          ]
          missing_runtime = [x for x in runtime_required if x not in runtime_paths]
          if missing_runtime:
              raise SystemExit("Runtime path/migration contract regression: " + repr(missing_runtime))
          if "DATA_ROOT = INSTALL_ROOT /" in desktop or "DATA_ROOT = INSTALL_ROOT /" in core:
              raise SystemExit("Installed writable data must not be coupled to the program directory")

          print("Packaging + version/update consistency OK:", dv)
          PY

      - name: Extract embedded UI JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("photo_curator.py").read_text(encoding="utf-8")
          html = re.search(r"HTML = r'''(.*?)</html>'''", source, re.S)
          if not html:
              raise SystemExit("Embedded HTML block not found")
          script = re.search(r"<script>(.*?)</script>", html.group(1), re.S)
          if not script:
              raise SystemExit("Embedded JavaScript block not found")
          js = script.group(1)
          js = re.sub(r"\{\{\s*map_style_(?:light|dark)\|tojson\s*\}\}", '""', js)
          Path("/tmp/photocurator-ui.js").write_text(js, encoding="utf-8")
          print("Extracted", len(js), "characters of JavaScript")
          PY

      - name: Check embedded UI JavaScript
        run: node --check /tmp/photocurator-ui.js

      - name: Check UI bootstrap declaration order
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("photo_curator.py").read_text(encoding="utf-8")
          first_boot = source.find("setupFilterBar();")
          if first_boot < 0:
              raise SystemExit("Initial setupFilterBar() bootstrap call not found")

          required_before_boot = [
              "const startBtn=document.getElementById('startBtn');",
              "let cullChunkToken=0, cullVisibleTotal=0;",
              "let dedupChunkToken=0;",
              "let dedupStatusFilter='pending', dedupVisibleTotal=0;",
              "let dedupStatusCounts={pending:0,reviewed:0,updated:0};",
          ]
          late = [
              token for token in required_before_boot
              if source.find(token) < 0 or source.find(token) > first_boot
          ]
          if late:
              raise SystemExit(
                  "UI bootstrap state is declared after first render call; "
                  "this can abort all later click bindings: " + repr(late)
              )

          required_bindings = [
              "document.getElementById('browseBtn').onclick=async()=>",
              "document.getElementById('folderInput').onchange=",
              "startBtn.onclick=()=>",
              "document.getElementById('settingsQuick').onclick=()=>",
              "document.getElementById('toolboxOpen').onclick=()=>",
          ]
          missing = [token for token in required_bindings if token not in source]
          if missing:
              raise SystemExit("Critical desktop interaction binding missing: " + repr(missing))

          print("UI bootstrap order + critical interaction bindings OK")
          PY

      - name: Check v1.5.0 runtime architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path("photo_curator.py").read_text(encoding="utf-8")
          tasks = Path("background_tasks.py").read_text(encoding="utf-8")
          desktop = Path("desktop_app.py").read_text(encoding="utf-8")
          runtime_paths = Path("runtime_paths.py").read_text(encoding="utf-8")
          requirements = Path("requirements.txt").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/build-release.yml").read_text(encoding="utf-8")

          required_core = [
              "BackgroundTaskManager",
              "_RUN_GATE_LOCK = threading.Lock()",
              "with _RUN_GATE_LOCK:",
              "_FILE_PLAN_LOCK = threading.Lock()",
              "def _active_restore_reservations",
              "reserved=reserved",
              "media_state",
              "similarity_group_state",
              "similarity_group_member",
              "TASK_MANAGER",
              "def _apply_media_lifecycle",
              "def _background_move_to_trash",
              "def _background_restore_trash",
              "def _background_purge_trash",
              "def _ensure_software_trash_record",
              "planned_trash_path=None",
              "'trash_path': planned_trash",
              "'restore_path': restore_path",
              "'recovered': True",
              "@app.route('/api/tasks')",
              "function coreRun()",
              "const coreSteps=['cull','dedup'];",
              "Promise.allSettled",
              "核心分析未完整启动，已回滚已启动任务",
              "pending_trash",
              "pending_permanent_delete",
              "permanently_deleted",
              "group['status'] = 'reviewed'",
              "group['status'] = 'updated'",
              "@app.route('/api/dedup-complete'",
              "TRASH_MANIFEST_NAME",
              ".photocurator-trash.json",
              "toolboxPanel",
              "sidebarCollapse",
              "dedupStatusFilter",
              "UI_RESULT_CHUNK = 200",
              "UI_LIVE_RESULT_CAP = 300",
              "askDeleteMode",
              "closeDeleteDialog('permanent')",
              "def _safe_move_file",
              "def _move_photo_bundle",
              "def _photo_sidecars",
              "catalog_update_media_lifecycle",
          ]
          missing = [x for x in required_core if x not in core]
          if missing:
              raise SystemExit("v1.5.0 core architecture regression: " + repr(missing))

          required_tasks = [
              "CREATE TABLE IF NOT EXISTS background_task",
              "idempotency_key",
              "state='queued'",
              "state='running'",
              "state='done'",
              "state='failed'",
              "def enqueue",
              "def summary",
          ]
          missing = [x for x in required_tasks if x not in tasks]
          if missing:
              raise SystemExit("background task architecture regression: " + repr(missing))

          required_desktop = [
              "import pystray",
              "load_tray_image",
              "tray.run_detached()",
              "window.hide()",
              "退出 PhotoCurator",
              "def stop_analysis_and_wait",
              "stop_analysis_and_wait()",
              "migrate_legacy_config(legacy_root, DATA_ROOT)",
              'os.environ["PHOTOCURATOR_DATA_DIR"] = str(DATA_ROOT)',
          ]
          missing = [x for x in required_desktop if x not in desktop]
          if missing:
              raise SystemExit("desktop tray regression: " + repr(missing))
          if "pystray" not in requirements:
              raise SystemExit("pystray dependency missing")
          required_runtime_paths = [
              "def default_user_data_root",
              "def resolve_data_root",
              "def migrate_legacy_config",
              "LOCALAPPDATA",
              "PhotoCurator",
          ]
          missing_runtime_paths = [x for x in required_runtime_paths if x not in runtime_paths]
          if missing_runtime_paths:
              raise SystemExit("runtime path policy regression: " + repr(missing_runtime_paths))
          if "id: release_meta" not in workflow or "refs/tags/v1.5.0" in workflow:
              raise SystemExit("Manifest-driven tag release workflow missing or hardcoded")

          banned = [
              "send2trash",
              "移入 Windows 回收站",
              "id=\"themeToggle\"",
              "[data-theme=dark]",
          ]
          leftovers = [x for x in banned if x in (core + requirements)]
          if leftovers:
              raise SystemExit("v1.5.0 legacy behavior returned: " + repr(leftovers))

          print("v1.5.0 runtime architecture guards OK")
          PY

      - name: Check core workflow and large-library guards
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("photo_curator.py").read_text(encoding="utf-8")

          required = [
              "def list_images(folder, recursive=False)",
              "compare_scope == 'global'",
              "review_override",
              "library_index.sqlite3",
              "PhotoCurator_RecycleBin（软件回收站）",
              "trashRestoreOne",
              "trashPurgeOne",
              "api_cull_results_chunk",
              "api_dedup_results_chunk",
              "cullLiveStore",
              "dedupLiveStore",
              "st_mtime_ns",
              ":v3",
              "collapsedFolders",
              "data-view=\"list\"",
              "data-view=\"small\"",
              "Gallery thumbnail zoom: Ctrl + wheel changes photo-card size, never page zoom.",
              "begin_catalog_scan(INDEX_DB, folder)",
              "catalog_scan_batch(INDEX_DB, scan_session, pending_catalog)",
              "finish_catalog_scan(",
              "note_catalog_scan_error(",
              "@app.route('/api/sources')",
              "id=\"sourcesList\"",
              "id=\"thumbSizeRange\"",
          ]
          missing = [x for x in required if x not in source]
          if missing:
              raise SystemExit("Core workflow regression: " + repr(missing))

          if "selected_path': selected" in source:
              raise SystemExit("Legacy single-keeper dedup state returned")

          scan_region = source.split("def _scan_snapshot_key", 1)[1].split(
              "# --------------------------------------------------------------------------- #\n#  CULL", 1
          )[0]
          helper = source.split("def _shared_list_images", 1)[1].split(
              "# --------------------------------------------------------------------------- #\n#  CULL", 1
          )[0]
          required_scan = [
              "def _scan_walk_error(exc):",
              "note_catalog_scan_error(",
              "on_error=_scan_walk_error",
              "begin_catalog_scan(INDEX_DB, folder)",
              "catalog_scan_batch(INDEX_DB, scan_session, pending_catalog)",
              "finish_catalog_scan(",
              "abort_catalog_scan(INDEX_DB, scan_session, str(exc))",
              "while entry and entry.get('state') == 'scanning':",
          ]
          missing_scan = [x for x in required_scan if x not in helper]
          if missing_scan:
              raise SystemExit("Crash-safe shared scan contract missing: " + repr(missing_scan))
          if "paths = _shared_list_images(folder, recursive=recursive)" in helper:
              raise SystemExit("Shared enumeration helper recursively calls itself")
          if "deadline = now + 60.0" in helper:
              raise SystemExit("Large libraries must not start a second scan after a fixed timeout")
          for required_key_part in (
              "output_mode = str(scan_cfg.get('output_mode') or 'source')",
              "custom_output = ''",
              "output_mode,",
              "custom_output,",
              "key = _scan_snapshot_key(folder, recursive)",
          ):
              if required_key_part not in scan_region:
                  raise SystemExit("Shared scan key is missing configuration identity: " + required_key_part)

          cull_block = source.split("def run_cull(", 1)[1].split(
              "def _relocate_for_status", 1
          )[0]
          cull_commit = cull_block.split("s['complete'] = True", 1)
          if len(cull_commit) != 2 or "_sync_dedup_with_cull()" not in cull_commit[1]:
              raise SystemExit("Cull completion must reconcile Dedup when parallel task order reverses")

          dedup_block = source.split("def run_dedup(", 1)[1].split(
              "# --------------------------------------------------------------------------- #\n#  RANK", 1
          )[0]
          if "paths = _shared_list_images(folder, recursive=recursive)" not in dedup_block:
              raise SystemExit("Dedup must reuse the shared source enumeration snapshot")

          run_api = source.split("@app.route('/api/run/<step>'", 1)[1].split(
              "@app.route('/api/stop/<step>'", 1
          )[0]
          gate_pos = run_api.find("with _RUN_GATE_LOCK:")
          active_pos = run_api.find("active = [k for k in ('cull', 'dedup', 'rank')")
          reserve_pos = run_api.find("state[step]['running'] = True")
          start_pos = run_api.find("threading.Thread(")
          if min(gate_pos, active_pos, reserve_pos, start_pos) < 0:
              raise SystemExit("Atomic analysis admission gate is incomplete")
          if not (gate_pos < active_pos < reserve_pos < start_pos):
              raise SystemExit("Analysis admission order must be gate -> check -> reserve -> start")

          print("Core workflow / large-library guards OK")
          PY

      - name: Check stable Windows shell contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          desktop = Path("desktop_app.py").read_text(encoding="utf-8")
          ui = Path("photo_curator.py").read_text(encoding="utf-8")
          core = ui

          required = (
              'APP_TITLE = "PhotoCurator"',
              "frameless=True",
              "maximized=False",
              "resizable=True",
              "min_size=(720, 520)",
              "webview.start(gui='edgechromium'",
              "tray.run_detached()",
              "def window_action(self, action)",
              "window.events.closing += on_closing",
              "def _windows_work_area(point=None)",
              "def _fit_window_to_work_area(window)",
          )
          missing = [item for item in required if item not in desktop]
          if missing:
              raise SystemExit("Stable Windows shell contract missing: " + repr(missing))

          forbidden_desktop = (
              "window.events.shown +=",
              "window.events.loaded +=",
              "window.native",
              "DwmSetWindowAttribute",
              "SetWindowTextW",
              "apply_native_titlebar_theme",
              "def after_webview_start",
              "webview.start(after_webview_start",
          )
          bad = [item for item in forbidden_desktop if item in desktop]
          if bad:
              raise SystemExit(
                  "Windows shell must not re-enter pywebview lifecycle/native handles: "
                  + repr(bad)
              )

          required_chrome = (
              'id="winMin"',
              'id="winMax"',
              'id="winClose"',
              "function nativeWindow(action)",
              "pywebview-drag-region",
              'class="app-brand"',
          )
          missing_chrome = [item for item in required_chrome if item not in ui]
          if missing_chrome:
              raise SystemExit("Stable frameless desktop chrome missing: " + repr(missing_chrome))

          required_ui = (
              'class="workspace-tabs"',
              'class="library-sidebar"',
              'class="inspector-drawer"',
              'id="sidebarUtilityHost"',
              'id="activityPanel"',
              'id="dashboardView"',
              'id="photoView"',
              "function showDashboard(",
              "function showPhotoView(",
              "function visibleInReview(",
              "repeat(auto-fill,var(--thumb-size))",
              "pc-thumb-size-v170",
          )
          missing_ui = [item for item in required_ui if item not in ui]
          if missing_ui:
              raise SystemExit("v1.7.8 workspace contract missing: " + repr(missing_ui))

          shortcuts = core.split("@app.route('/api/shortcuts')", 1)[1].split(
              "@app.route('/api/sources')", 1
          )[0]
          forbidden_first_paint = (
              "ensure_builtin_demo()",
              "detect_sd_cards()",
              "catalog_storage_summary(",
              "catalog_list_sources(INDEX_DB)",
          )
          bad_startup = [x for x in forbidden_first_paint if x in shortcuts]
          if bad_startup:
              raise SystemExit(
                  "First-paint shortcuts route performs blocking work: "
                  + repr(bad_startup)
              )
          if "catalog_list_sources(INDEX_DB, refresh=False)" not in shortcuts:
              raise SystemExit("First-paint source list must not probe physical drives")
          if "setTimeout(refreshEnvironment,5000)" not in core:
              raise SystemExit("Physical-drive refresh must be deferred after first paint")

          if "PILLOW_IMG_EXTS" not in core or "Image.registered_extensions()" not in core:
              raise SystemExit("Image discovery must follow installed decoder capability")

          if "REVIEW_HIDDEN_LIFECYCLES" not in core:
              raise SystemExit("Review lifecycle visibility must be centralized")

          env_refresh = core.split("@app.route('/api/environment-refresh')", 1)[1].split(
              "@app.route('/api/demo-status')", 1
          )[0]
          if "detect_sd_cards()" in env_refresh:
              raise SystemExit("Periodic environment refresh must not scan camera-card filesystems")

          catalog = Path("catalog.py").read_text(encoding="utf-8")
          catalog_tree = ast.parse(catalog)
          mount_fn = next(
              (
                  node for node in catalog_tree.body
                  if isinstance(node, ast.FunctionDef)
                  and node.name == "_mounted_volume_map"
              ),
              None,
          )
          if mount_fn is None:
              raise SystemExit("Mounted-volume presence probe is missing")

          blocking_calls = []
          for call in (node for node in ast.walk(mount_fn) if isinstance(node, ast.Call)):
              fn = call.func
              if isinstance(fn, ast.Name) and fn.id == "volume_info_for_path":
                  blocking_calls.append("volume_info_for_path")
                  continue
              if not isinstance(fn, ast.Attribute):
                  continue
              owner = fn.value.id if isinstance(fn.value, ast.Name) else ""
              qualified = f"{owner}.{fn.attr}" if owner else fn.attr
              if (
                  qualified in {"shutil.disk_usage", "os.stat", "os.scandir", "Path.resolve"}
                  or fn.attr == "resolve"
              ):
                  blocking_calls.append(qualified)
          if blocking_calls:
              raise SystemExit(
                  "Periodic mounted-volume probe performs blocking filesystem work: "
                  + repr(sorted(set(blocking_calls)))
              )

          db_runtime = Path("db_runtime.py").read_text(encoding="utf-8")
          for required_db in (
              "PRAGMA busy_timeout=",
              "PRAGMA foreign_keys=ON",
              "PRAGMA synchronous=NORMAL",
              "PRAGMA journal_mode=WAL",
          ):
              if required_db not in db_runtime:
                  raise SystemExit("Shared SQLite release policy missing: " + required_db)

          for required_catalog in (
              "CATALOG_SCHEMA_VERSION",
              "CREATE TABLE IF NOT EXISTS scan_session",
              "scan_generation",
              "def begin_catalog_scan",
              "def catalog_scan_batch",
              "def finish_catalog_scan",
              "def abort_catalog_scan",
              "def update_media_lifecycle",
              "def discover_mounted_devices",
              "def note_catalog_scan_error",
              "terminal_state = \"completed\" if error_count == 0 else \"partial\"",
          ):
              if required_catalog not in catalog:
                  raise SystemExit("Catalog release contract missing: " + required_catalog)

          if "OFFLINE_PREVIEW_DIR = DATA_ROOT / 'offline_previews'" not in core:
              raise SystemExit("Offline previews must live outside temporary cache")
          if "TASK_MANAGER.register('build_offline_previews'" not in core:
              raise SystemExit("Durable offline previews must be generated in background batches")

          print("Deadlock-safe shell + nonblocking device presence + first-paint contract OK")
          PY

      - name: Check UI boot and state separation
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path("/tmp/photocurator-ui.js").read_text(encoding="utf-8")
          required = [
              "const startBtn=document.getElementById('startBtn');",
              "let cullReady=false;",
              "function coreRun()",
              "function syncCurrentView()",
              "function waitTaskAndSync",
              "function dedupMemberState",
              "function dedupGroupStatusLabel",
              "function askDeleteMode",
              "function askBatchConfirm",
              "document.getElementById('appExit').onclick=async()=>",
              "fetch('/api/tasks')",
              "document.getElementById('taskFiles')",
              "const latestFailed=(tasks.items||[]).find",
              "后台文件任务失败，请打开任务中心查看",
              "未完成的文件任务已持久化，将在下次启动后自动继续",
              "Promise.allSettled(activeSteps.map(step=>fetch('/api/stop/'+step",
          ]
          missing = [x for x in required if x not in js]
          if missing:
              raise SystemExit("UI state architecture regression: " + repr(missing))
          if js.find("const startBtn=document.getElementById('startBtn');") > js.find("setupFilterBar();"):
              raise SystemExit("startBtn must initialize before setupFilterBar")
          print("UI boot / state separation OK")
          PY

      - name: Validate embedded HTML and CSS structure
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("photo_curator.py").read_text(encoding="utf-8")
          for token, expected in {
              "<html": 1, "</html>": 1,
              "<style>": 1, "</style>": 1,
              "<script>": 1, "</script>": 1,
          }.items():
              count = source.count(token)
              if count != expected:
                  raise SystemExit(f"{token}: expected {expected}, got {count}")

          html = re.search(r"HTML = r'''(.*?)</html>'''", source, re.S)
          style = re.search(r"<style>(.*?)</style>", html.group(1), re.S)
          css = re.sub(r"/\*.*?\*/", "", style.group(1), flags=re.S)
          depth = 0
          for i, ch in enumerate(css):
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth < 0:
                      raise SystemExit(f"CSS unexpected closing brace at {i}")
          if depth:
              raise SystemExit(f"CSS brace balance failed: {depth}")
          for query in (
              "@media (max-width: 1100px)",
              "@media (max-width: 820px)",
              "@media (max-width: 620px)",
              "@media (max-height: 700px)",
          ):
              if query not in css:
                  raise SystemExit("Missing responsive rule: " + query)
          print("Embedded HTML/CSS structure OK")
          PY

      - name: Visible UI localization regression check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("photo_curator.py").read_text(encoding="utf-8")
          html = re.search(r"HTML = r'''(.*?)</html>'''", source, re.S)
          ui = html.group(1)
          banned = [
              "Hover any row for what it measures.",
              "Pick a folder",
              "Browse…",
              "God Mode",
              "Export TOP photos",
              "Export Phone BG",
              "Move blurry →",
              "Restore all",
              "Step 1 · Cull",
              "Step 2 · Dedup",
              "Step 3 · Rank",
          ]
          leftovers = [x for x in banned if x in ui]
          if leftovers:
              raise SystemExit("Visible English UI regression: " + repr(leftovers))
          print("Visible UI localization regression OK")
          PY

  windows-smoke:
    # Only run the costly Windows smoke suite for PR validation or an explicit manual check.
    # Release commits already run the packaged EXE self-test in build-release.yml.
    if: "${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}"
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
          pip install "selenium>=4.25,<5"

      - name: Verify optional photo formats
        run: |
          python -c "import raw_loader; assert raw_loader.HAS_RAWPY, 'RAW support missing'; assert raw_loader.HAS_HEIF, 'HEIC support missing'; print('RAW/HEIC support OK')"

      - name: Validate Windows launcher scripts
        shell: cmd
        run: |
          set PHOTOCURATOR_BATCH_PARSE_ONLY=1
          call PhotoCurator-Install.cmd
          if errorlevel 1 exit /b 1
          call PhotoCurator-Start.cmd
          if errorlevel 1 exit /b 1
          call PhotoCurator-Browser.cmd
          if errorlevel 1 exit /b 1
          call PhotoCurator-Debug.cmd
          if errorlevel 1 exit /b 1
          call PhotoCurator-Check.cmd
          if errorlevel 1 exit /b 1
          call PhotoCurator-Logs.cmd
          if errorlevel 1 exit /b 1

      - name: Compile Python sources
        run: |
          python -m py_compile db_runtime.py desktop_app.py runtime_paths.py catalog.py photo_curator.py background_tasks.py photo_dedup_batch.py exact_duplicates.py test_exact_duplicates.py photo_file_organizer.py photo_ranking_engine.py photo_ranking_v3.py raw_loader.py "基础冒烟测试.py" "Codespaces冒烟测试.py" windows_smoke_test.py ui_smoke_test.py

      - name: Runtime data path and migration smoke test
        shell: powershell
        run: |
          @'
          import json
          import os
          import sqlite3
          import tempfile
          from pathlib import Path
          from runtime_paths import default_user_data_root, migrate_legacy_config

          expected = Path(os.environ["LOCALAPPDATA"]) / "PhotoCurator" / "data"
          if default_user_data_root() != expected:
              raise SystemExit(f"wrong Windows data root: {default_user_data_root()} != {expected}")

          schema = """
          CREATE TABLE cull_cache (
            path TEXT PRIMARY KEY, size INTEGER NOT NULL, mtime_ns INTEGER NOT NULL,
            region_s REAL NOT NULL, quality REAL NOT NULL, updated_at REAL NOT NULL
          )
          """

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              legacy = root / "install" / "data"
              target = root / "user" / "data"
              lcfg = legacy / "config"
              tcfg = target / "config"
              lcfg.mkdir(parents=True)
              tcfg.mkdir(parents=True)

              legacy_db = lcfg / "library_index.sqlite3"
              target_db = tcfg / "library_index.sqlite3"

              db = sqlite3.connect(legacy_db)
              try:
                  db.execute(schema)
                  db.execute(
                      "INSERT INTO cull_cache VALUES(?,?,?,?,?,?)",
                      ("X:/photo.jpg", 100, 10, 222.0, 88.0, 200.0),
                  )
                  db.commit()
              finally:
                  db.close()

              db = sqlite3.connect(target_db)
              try:
                  db.execute(schema)
                  db.execute(
                      "INSERT INTO cull_cache VALUES(?,?,?,?,?,?)",
                      ("X:/photo.jpg", 100, 10, 111.0, 55.0, 100.0),
                  )
                  db.commit()
              finally:
                  db.close()

              (lcfg / "recents.json").write_text(
                  json.dumps(["X:/archive"]), encoding="utf-8"
              )
              (tcfg / "recents.json").write_text(
                  json.dumps(["D:/current"]), encoding="utf-8"
              )
              (legacy / "cache").mkdir(parents=True)
              (legacy / "cache" / "rebuildable.bin").write_bytes(b"cache")

              if not migrate_legacy_config(legacy, target):
                  raise SystemExit("legacy config migration did not run")

              db = sqlite3.connect(target_db)
              try:
                  row = db.execute(
                      "SELECT region_s,quality,updated_at FROM cull_cache "
                      "WHERE path='X:/photo.jpg'"
                  ).fetchone()
              finally:
                  db.close()
              if row != (222.0, 88.0, 200.0):
                  raise SystemExit(f"newer legacy catalog row was not merged: {row!r}")

              recents = json.loads((tcfg / "recents.json").read_text(encoding="utf-8"))
              if recents[:2] != ["D:/current", "X:/archive"]:
                  raise SystemExit(f"recents were not merged safely: {recents!r}")

              backups = list((target / "backups").glob("library_index-before-migration-*.sqlite3"))
              if not backups:
                  raise SystemExit("target catalog was not backed up before merge")

              if (target / "cache").exists():
                  raise SystemExit("rebuildable cache should not be migrated")

              # Windows must be able to rename the old DB immediately after
              # migration. This catches leaked ATTACH/connection handles.
              released = legacy_db.with_suffix(".released.sqlite3")
              legacy_db.rename(released)
              released.rename(legacy_db)

          print("Runtime data path/migration merge + handle release OK")
          '@ | python -

      - name: Unicode path and background lifecycle smoke test
        run: |
          python "基础冒烟测试.py"
          python release_gate_test.py

      - name: Background task history regression
        run: |
          python -m unittest -v test_background_task_history
          python -m unittest -v test_catalog_unique_count
          python -m unittest -v test_device_connection_identity
          python -m unittest -v test_missing_delete_safety
          python -m unittest -v test_scan_error_fail_closed
          python -m unittest -v test_exact_duplicates
          python -m unittest -v test_quality_annotations quality_annotations_input_test
          python -m unittest -v test_runtime_migration_wal
          python -m unittest -v test_offline_preview_guard
          python -m unittest -v test_storage_cleanup_containment
          python -m unittest -v test_scene_labels
          python -m unittest -v test_raw_pair_protection
          python -m unittest -v test_rank_topn_selection
          python -m unittest -v test_db_runtime_wal
          python -m unittest -v test_safe_move_integrity

      - name: Performance architecture regression gate
        run: |
          python performance_gate_test.py
          python test_desktop_instance_guard.py
          python test_frontend_stale_request.py

      - name: Real desktop UI interaction smoke test
        run: |
          python ui_smoke_test.py

      - name: Codespaces forwarding security smoke test
        run: |
          python "Codespaces冒烟测试.py"

      - name: Technical identifier localization guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("photo_curator.py").read_text(encoding="utf-8")
          banned = ["DateTime原始照片","Lens原始照片","Exposure时间","Focal长度"]
          bad = [x for x in banned if x in source]
          if bad:
              raise SystemExit("Technical identifiers were localized accidentally: " + repr(bad))
          for required in ("DateTimeOriginal","LensModel","ExposureTime","FocalLength"):
              if required not in source:
                  raise SystemExit("Missing required EXIF identifier: " + required)
          print("Technical identifier localization guard OK")
          PY
